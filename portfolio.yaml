short_description: |
  LSTM stock trend classifier rebuilt as a production MLOps pipeline.
  SageMaker Training Job, Model Registry, and Real-Time Endpoint. Flask
  frontend on Azure App Service calls the SageMaker endpoint — multi-cloud
  architecture mirroring enterprise deployments.
  Pattern detection only — not financial advice.
full_description: |
  A production MLOps pipeline built on Amazon SageMaker for stock trend
  pattern detection. The model architecture — a stacked LSTM trained on
  60-day sequences of technical indicators across AAPL, MSFT, and GOOGL —
  is intentionally identical to stock-trend-lstm. The difference is entirely
  in the infrastructure.

  Training runs as a managed SageMaker Training Job on ml.m5.xlarge, with
  hyperparameters passed via argparse and the model saved in TensorFlow
  SavedModel format to S3. The trained model is registered in SageMaker Model
  Registry with full versioning and approval status tracking — the production
  equivalent of the manual model_registry.csv pattern used in
  telco-churn-predictor. Inference is served via a SageMaker Real-Time
  Endpoint, eliminating cold starts and enabling auto-scaling.

  The Flask frontend runs on Azure App Service and calls the SageMaker endpoint
  via boto3 — a deliberate multi-cloud architecture that mirrors enterprise
  deployments where Azure handles application infrastructure and AWS handles
  the ML backend. AWS credentials are stored as Azure App Service environment
  variables, never in code.

  Includes Amazon Bedrock (Claude Haiku) zero-shot pattern interpretation as a
  comparator, completing the four-project cross-task benchmark: tabular
  classification (churn), short text (spam), long text (sentiment), and time
  series (trend).

problem: |
  Demonstrating the gap between ad-hoc ML (local training, committed model
  files, Flask inference) and production MLOps (managed training jobs, model
  registry, dedicated inference endpoints) — and implementing both patterns
  on the same model so the architectural difference is clear.

solution: |
  Full SageMaker MLOps pipeline: prepare_data.py uploads training data to S3,
  run_training_job.py launches a managed Training Job, register_model.py
  versions the artefact in Model Registry, deploy_endpoint.py creates a
  Real-Time Endpoint, and a Flask app on Azure App Service calls it. A
  delete_endpoint.py script handles cleanup to prevent runaway charges.

challenges: |
  SageMaker Training Jobs require strict conventions that differ from local
  training: data paths from environment variables, hyperparameters via argparse,
  SavedModel format at SM_MODEL_DIR/1/. The multi-cloud authentication pattern
  — storing AWS credentials as Azure App Service environment variables —
  requires careful handling to avoid committing credentials to Git. Endpoint
  cost management (deleting after demo) is a production consideration absent
  from local deployments.

